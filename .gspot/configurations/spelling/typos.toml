[default]
locale = "en"
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "\\b[A-Za-z0-9+/]{40,}={0,2}\\b"]

[default.extend-words]
CFM = "CFM"
CUDA = "CUDA"
DiT = "DiT"
Distillation = "Distillation"
FSQ = "FSQ"
GPU = "GPU"
HF = "HF"
LoRA = "LoRA"
MiniCPM = "MiniCPM"
OpenBMB = "OpenBMB"
Orpheus = "Orpheus"
PCM = "PCM"
TTS = "TTS"
VoxCPM = "VoxCPM"
WAV = "WAV"
WebDataset = "WebDataset"
audiovae = "audiovae"
kHz = "kHz"
locdit = "locdit"
locenc = "locenc"
lora = "lora"
tara = "tara"
voxcpm = "voxcpm"
yapwithai = "yapwithai"
zac = "zac"

[files]
extend-exclude = [
  # Files that gspot generates
  ".gspot/**",
  ".gspot-copies/**",
  ".editorconfig",
  ".github/workflows/gspot.yml",
  ".markdownlint.jsonc",
  ".prettierignore",
  "prettier.config.mjs",
  "pyrightconfig.json",
  "ruff.toml",
  # Generator outputs
  "**/*.pbxproj",
  "**/*.xcstrings",
  "**/*.svg",
  "**/*.min.js",
  "**/*.min.css",
  # Paths that configurations leave out
  "**/.venv/**",
  "**/venv/**",
  "**/__pycache__/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.mypy_cache/**",
  "**/coverage/**",
  "**/.env",
  "**/.env.*",
  "**/.dev.vars",
  "**/.dev.vars.*",
  # Lockfiles
  "**/*.lock",
  "**/bun.lockb",
  "**/pnpm-lock.yaml",
  "**/package-lock.json",
  "**/npm-shrinkwrap.json",
  "**/go.sum",
  "**/Package.resolved",
  # Paths that the tracked .gitignore files leave out
  "**/.mise.local.toml",
  "**/*.py[cod]",
  "**/*$py.class",
  "**/*.so",
  "**/*.egg-info/**",
  "**/dist/**",
  "**/build/**",
  "**/.coverage",
  "**/coverage.xml",
  "**/htmlcov/**",
  "**/node_modules/**",
  "dataset_output/**",
  "training_output/**",
  "**/.cache/**",
  "**/*.tar",
  "**/*.wav",
  "**/*.mp3",
  "**/.run/**",
  "**/logs/**",
  "**/*.log",
  "**/.idea/**",
  "**/.vscode/**",
  "**/.cursor/**",
  "**/.claude/**",
  "**/*.swp",
  "**/*.swo",
  "**/*~",
  "**/.DS_Store",
  # Real misspellings were fixed in the corpus commit; what remains is slang and dialect spelling that the voices read aloud on purpose, so changing it changes the dataset.
  "config/prompts/**",
]
